name: release
# Every merge into main is a release of the spec version the port
# implements: the tag is v + the suiteVersion of conformance/port.json.
# It fails when that version is already tagged — a port-only fix after a
# tag needs a spec bump, because the port's version is the spec's. A merge
# that touches only the documentation (docs/, site/, README.md, CLAUDE.md),
# the workflows (.github/), the examples (examples/) or the scripts
# (scripts/) is not a release and needs no tag; the site publishes from
# main anyway (pages.yml). What a tag resolves for a user, the library
# packages, their tests and the vendored spec, is a release.
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency: { group: release }
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Is this a release?
        id: scope
        run: |
          # A root commit (main's first push) has no parent: all of it is new.
          if git rev-parse -q --verify HEAD~1 >/dev/null; then
            files=$(git diff --name-only HEAD~1 HEAD)
          else
            files=$(git ls-tree -r --name-only HEAD)
          fi
          changed=$(printf '%s\n' "$files" | grep -vE '^(docs/|site/|examples/|scripts/|README\.md$|CLAUDE\.md$|\.github/)' || true)
          echo "release=$([ -n "$changed" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - name: Tag the version
        if: steps.scope.outputs.release == 'yes'
        run: |
          version=v$(python3 -c "import json;print(json.load(open('conformance/port.json'))['suiteVersion'])")
          grep -q "^## ${version#v} " CHANGELOG.md || { echo "CHANGELOG.md has no heading for ${version#v}"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "$version is already tagged: a port change needs a spec version"; exit 1
          fi
          git tag "$version" && git push origin "$version"
